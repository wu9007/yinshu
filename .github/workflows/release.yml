name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  quality:
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --workspace
      - run: pnpm --dir apps/desktop typecheck
      - run: pnpm --dir apps/desktop lint
      - run: pnpm --dir apps/desktop test
      - run: >-
          node --test
          scripts/prepare-windows-cli.test.mjs
          scripts/release-version.test.mjs
          scripts/release.test.mjs
          scripts/label-release-assets.test.mjs

  prepare-release:
    needs: quality
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Tag must point at a commit on main"
            exit 1
          fi

          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/package.json', 'utf8')).version")"
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="$(node scripts/release-version.mjs tag "$VERSION")"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match version $VERSION (expected $EXPECTED)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          ARGS=(
            "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "印枢 ${TAG}"
            --notes "See the assets to download and install this version."
            --draft
          )
          if node scripts/release-version.mjs prerelease "$VERSION" | grep -qx true; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"

  publish-tauri:
    needs: prepare-release
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release version
        id: release_version
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/package.json', 'utf8')).version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(node scripts/release-version.mjs prerelease "$VERSION")" >> "$GITHUB_OUTPUT"

      - name: Prepare Windows CLI sidecar
        run: node scripts/prepare-windows-cli.mjs x86_64-pc-windows-msvc

      - name: Clear cached installer bundles
        shell: bash
        run: rm -rf target/*/release/bundle target/release/bundle

      - name: Publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: 印枢 ${{ needs.prepare-release.outputs.tag }}
          releaseBody: See the assets to download and install this version.
          releaseDraft: true
          prerelease: ${{ steps.release_version.outputs.prerelease }}
          args: --target x86_64-pc-windows-msvc --bundles nsis

      - name: Label release installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/label-release-assets.mjs upload --tag "${{ needs.prepare-release.outputs.tag }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare-release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false
